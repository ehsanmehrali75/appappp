# Nginx Configuration Snippet for Maarksho Enterprise SEO & Analytics
# Include this or paste into your server { ... } block in /etc/nginx/sites-available/maarksho.com

location /admin/business/ {
    rewrite ^/admin/business/([^/]+)/seo(?:/(.*))?$ /panel/seo_intel/index.php?business=$1&view=$2 last;
    rewrite ^/admin/business/([^/]+)/?$ /admin/business/$1/seo permanent;
    try_files $uri $uri/ /admin/business/index.php?$args;
}

location /admin/projects/ {
    rewrite ^/admin/projects/([^/]+)/seo(?:/(.*))?$ /panel/seo_intel/index.php?business=$1&view=$2 last;
    try_files $uri $uri/ /admin/projects/index.php?$args;
}

location /admin/seo {
    rewrite ^/admin/seo(?:/(.*))?$ /panel/seo_intel/index.php?view=$1 last;
}
