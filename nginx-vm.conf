# Nginx Configuration Snippet for Maarksho Intelligence & Enterprise SEO
# Add this inside your server { ... } block in /etc/nginx/sites-available/maarksho.com (or Nginx vhost):

# Enterprise SEO for Businesses: /admin/business/{slug}/seo[/{view}]
location /admin/business/ {
    rewrite ^/admin/business/([^/]+)/seo(?:/(.*))?$ /panel/seo_intel/index.php?business=$1&view=$2 last;
    rewrite ^/admin/business/([^/]+)/?$ /admin/business/$1/seo permanent;
    try_files $uri $uri/ /admin/business/index.php?$args;
}

# Projects Routes: VM & SEO
location /admin/projects/ {
    rewrite ^/admin/projects/([^/]+)/seo(?:/(.*))?$ /panel/seo_intel/index.php?business=$1&view=$2 last;
    rewrite ^/admin/projects/([^/]+)/vm(?:/(.*))?$ /panel/vm/index.php?project_slug=$1&view=$2 last;
    try_files $uri $uri/ /admin/projects/index.php?$args;
}

# Direct SEO shortcuts
location /admin/seo {
    rewrite ^/admin/seo(?:/(.*))?$ /panel/seo_intel/index.php?view=$1 last;
}

location = /admin {
    rewrite ^ /panel/admin.php last;
}
location = /admin/ {
    rewrite ^ /panel/admin.php last;
}
