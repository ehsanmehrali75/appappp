name: Regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sqlite3, pdo_sqlite, gd, zip, mbstring, fileinfo, curl, dom, exif
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l > /tmp/php-lint.txt
      - name: Isolated PHP regressions
        run: |
          for suite in access_control system_admins owner_recovery support_tickets erp_inventory_contract tiam_inventory tiam_factinventory website_catalog_sync website_workflow website_export image_production request_security; do
            php "tests/$suite.php" || exit 1
          done
      - name: Python agent and real HTTP regressions
        env:
          PHP_BINARY: php
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Legacy host list compatibility
        run: php -d disable_functions=array_is_list tests/website_workflow.php
      - name: Install browser regression dependencies
        if: matrix.php == '8.2'
        run: |
          python -m pip install 'playwright>=1.40,<2'
          python -m playwright install --with-deps chromium
      - name: Portal workflows and Size Studio branding in Chromium
        if: matrix.php == '8.2'
        env:
          PHP_BINARY: php
        run: |
          python tests/browser_workspace.py
          python tests/browser_size_studio.py
          python tests/browser_product_import.py
          python tests/browser_website_catalog.py
          python tests/browser_support.py
      - name: Validate deployment package
        run: python tools/build_release.py --output /tmp/maarksho-release.zip
  desktop-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop scraper dependencies
        run: |
          python -m pip install -r app/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Deferred size guides and refresh
        run: |
          python app/verify_size_guide.py
          python app/verify_media.py
          python app/verify_color.py
      - name: Desktop settings reach the scraper
        env:
          QT_QPA_PLATFORM: offscreen
        run: python app/verify_ui.py
      - name: Download ZIP matches current source
        run: python tools/build_scraper_package.py --check
